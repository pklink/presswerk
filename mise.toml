[tools]
erlang = "latest"
elixir = "latest"
opencode = "latest"

[tasks.setup]
description = "Set up the local development environment"
run = "mix setup && git config core.hooksPath .githooks"

[tasks.dev]
description = "Start the Phoenix server"
run = "mix phx.server"

[tasks.opencode]
description = "Start OpenCode"
run = "opencode"

[tasks.test]
description = "Run tests"
run = "mix test"

[tasks.check]
description = "Run precommit checks"
run = "mix precommit"

[tasks.release]
description = "Commit and tag a release, then start the next -dev version locally"
usage = '''
arg "<part>" help="Version part to bump" {
  choices "patch" "minor" "major"
}
'''
run = 'elixir scripts/release.exs "${usage_part?}"'

[tasks."db:migrate"]
description = "Run database migrations"
run = "mix ecto.migrate"

[tasks."assets:build"]
description = "Rebuild assets"
run = "mix assets.build"
